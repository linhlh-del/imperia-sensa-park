# /etc/nginx/sites-available/sensa  →  ln -s ../sites-available/sensa /etc/nginx/sites-enabled/sensa
#
# IMPERIA SENSA PARK — 3 domain, MỖI DOMAIN MỘT THƯ MỤC BUILD RIÊNG (cùng mã nguồn, cấu hình trong sites/<domain>/site.env):
#   sensaparkmik.vn          domain chính
#   canhoimperiasensa.vn     domain vệ tinh
#   sensapark-residences.vn  domain vệ tinh
#   root = /var/www/sensa/sites/$host/current  (scripts/release.mjs tạo releases/ + symlink current cho từng domain)
#   www.<domain> → 301 https://<domain>
# Thêm domain mới: tạo sites/<domain>/site.env, thêm tên vào 3 chỗ server_name dưới đây, thêm route trên tunnel, build lại.
#
# Đi qua Cloudflare Tunnel. Mọi route của 3 domain: HTTPS → localhost:443, Origin Server Name = sensaparkmik.vn
# → nginx chọn đúng chứng chỉ Origin của Sensa (dùng chung VPS với QTOPIA, mỗi dự án một chứng chỉ, chọn theo SNI):
#   /etc/ssl/cloudflare/sensaparkmik.vn.pem  và  /etc/ssl/cloudflare/sensaparkmik.vn.key (chmod 600)
#
# Thư mục trên VPS:
#   /var/www/sensa/src                          mã nguồn (git clone) + .env.production
#   /var/www/sensa/sites/<domain>/releases      các bản build của domain
#   /var/www/sensa/sites/<domain>/current       symlink → bản đang chạy

server {
    listen 80;
    listen [::]:80;
    server_name sensaparkmik.vn canhoimperiasensa.vn sensapark-residences.vn
                www.sensaparkmik.vn www.canhoimperiasensa.vn www.sensapark-residences.vn;
    return 301 https://$host$request_uri;
}

# www.<domain> → https://<domain> (giữ đường dẫn)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx < 1.25.1 (Ubuntu 22.04 = 1.18): xoá dòng này và dùng "listen 443 ssl http2;"
    server_name www.sensaparkmik.vn www.canhoimperiasensa.vn www.sensapark-residences.vn;

    ssl_certificate     /etc/ssl/cloudflare/sensaparkmik.vn.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sensaparkmik.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    location / {
        if ($host ~* ^www\.(.+)$) { return 301 https://$1$request_uri; }
        return 301 https://sensaparkmik.vn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx < 1.25.1: xoá dòng này và dùng "listen 443 ssl http2;"
    server_name sensaparkmik.vn canhoimperiasensa.vn sensapark-residences.vn;

    ssl_certificate     /etc/ssl/cloudflare/sensaparkmik.vn.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sensaparkmik.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # $host chỉ có thể là một trong 3 tên ở server_name → mỗi domain đọc đúng thư mục của mình
    root /var/www/sensa/sites/$host/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    # ---- Nén ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/ld+json image/svg+xml application/manifest+json application/xml;

    # ---- Header bảo mật: deploy/sensa-security.conf → /etc/nginx/snippets/ (include lại trong location có add_header) ----
    include /etc/nginx/snippets/sensa-security.conf;

    # ---- Đường dẫn đặc biệt (giống vercel.json) ----
    location = /tinh-tra-gop { return 301 /bang-gia; }
    # /lien-he và /chinh-sach-ban-hang là section của trang chủ (app tự cuộn tới section)
    location = /lien-he             { try_files /index.html =404; add_header Cache-Control "public, max-age=0, must-revalidate"; include /etc/nginx/snippets/sensa-security.conf; }
    location = /chinh-sach-ban-hang { try_files /index.html =404; add_header Cache-Control "public, max-age=0, must-revalidate"; include /etc/nginx/snippets/sensa-security.conf; }

    # ---- URL sạch: /vi-tri → vi-tri/index.html; bỏ dấu / ở cuối; 404 thật ----
    rewrite ^/(.+)/$ /$1 permanent;
    location / {
        try_files $uri $uri/index.html =404;
        # HTML luôn kiểm tra lại để thấy nội dung CMS mới ngay sau khi phát hành
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/snippets/sensa-security.conf;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }

    # ---- Cache: file JS/CSS có hash 1 năm; ảnh 7 ngày (tên ảnh không có hash) ----
    location ~* ^/assets/.+\.(js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/sensa-security.conf;
    }
    location ~* \.(webp|jpg|jpeg|png|svg|avif|ico)$ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        include /etc/nginx/snippets/sensa-security.conf;
    }

    # ---- CMS đọc 2 file này để biết trường sửa được và bản nào đang chạy ----
    location ~ ^/cms-(schema|status)\.json$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/sensa-security.conf;
    }

    # ---- Webhook phát hành từ CMS → deploy hook nội bộ (dùng chung service với QTOPIA, project sensa-park) ----
    location = /cms-deploy {
        access_log off;   # URL có thể chứa ?token=… → không ghi log
        proxy_pass http://127.0.0.1:8790/deploy$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
        limit_except GET POST { deny all; }
    }

    # chặn file ẩn (.env, .git…)
    location ~ /\. { deny all; return 404; }
}
